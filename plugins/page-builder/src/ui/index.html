<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>页面搭建器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="startup-status" role="status">正在启动页面搭建器…</div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>页面搭建器</span></div>
      <div id="page-name" class="page-name-control" aria-label="页面名称"></div>
      <div class="save-state" id="save-state"></div>
      <div class="toolbar" role="toolbar" aria-label="页面操作">
        <div id="undo" class="ui-control"></div>
        <div id="redo" class="ui-control"></div>
        <div id="viewport-tabs" class="viewport-tabs"></div><div id="viewport-panels" class="sr-only"></div>
        <div id="toggle-inspector" class="ui-control inspector-toggle"></div>
        <div id="preview" class="ui-control"></div>
        <div id="export" class="ui-control"></div>
      </div>
    </header>
    <aside class="left-panel panel">
      <div id="left-tabs" class="tabs"></div>
      <div id="left-panels" class="left-panels">
        <div id="components-panel" class="panel-content">
          <details class="library-settings"><summary>组件库来源与更新</summary><p id="library-version"></p><div id="library-source"></div><div id="library-refresh"></div><p id="library-update-status" role="status"></p></details>
          <div id="component-search" class="search-control"></div>
          <div class="section-label">已适配组件</div><div id="component-list" class="component-list"></div>
          <div class="section-label">布局</div><div id="layout-list" class="component-list"></div>
        </div>
        <div id="structure-panel" class="panel-content"><div id="tree" class="tree"></div></div>
      </div>
    </aside>
    <main class="workspace">
      <div class="canvas-toolbar"><span id="breadcrumb">页面</span><span id="selection-hint">⌘ / Ctrl + 点击多选</span><span id="revision-badge"></span></div>
      <div class="canvas-scroll"><div id="canvas-frame" class="canvas-frame"><div id="canvas" class="canvas" aria-label="页面画布"></div></div></div>
      <div class="statusbar"><span id="provider-status">正在连接真实组件…</span><span id="node-count">0 个节点</span></div>
    </main>
    <aside class="right-panel panel">
      <div class="inspector-heading">
        <div><strong>属性</strong><span id="selection-type">未选择</span></div>
        <div class="context-connection"><div id="context-status" class="context-status"></div><div id="sync-context" class="ui-control"></div></div>
      </div>
      <div id="inspector" class="inspector"><div class="empty-inspector"><span class="empty-icon" aria-hidden="true"></span><p>选择画布中的组件</p><small>在这里修改内容、变体和状态</small></div></div>
    </aside>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
